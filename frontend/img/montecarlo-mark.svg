<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Monte Carlo">
  <title>Monte Carlo</title>
  <!-- One starting point, many simulated futures: the paths fan out into a range of
       outcomes. The amber path is the typical outcome; the smaller points towards the
       edges are the rarer ones. Same colours and node style as the CortXplorer mark. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6">
    <path d="M10 32 L24 26 L38 17 L54 10 M10 32 L25 39 L39 48 L54 54" stroke="#9B7FD4"/>
    <path d="M10 32 L25 33 L40 24 L54 21 M10 32 L24 36 L40 40 L54 43" stroke="#5E9CA6"/>
    <path d="M10 32 L26 29 L40 34 L54 32" stroke="#E0A33E"/>
  </g>
  <g fill="#9B7FD4"><circle cx="54" cy="10" r="3.2"/><circle cx="54" cy="54" r="3.2"/></g>
  <g fill="#5E9CA6"><circle cx="54" cy="21" r="3.9"/><circle cx="54" cy="43" r="3.9"/><circle cx="10" cy="32" r="4.2"/></g>
  <circle cx="54" cy="32" r="5" fill="#E0A33E"/>
</svg>
